[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tft-accounting-refactor"
version = "0.1.0"
description = "Refactored TensorFlow accounting forecasting package"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
tft-preprocess = "tft_accounting.preprocessing:main"
tft-train = "tft_accounting.training:main"
tft-backtest = "tft_accounting.backtesting:main"
tft-theory = "tft_accounting.theory:main"
tft-plot = "tft_accounting.plotting:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tft_accounting*"]


[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
